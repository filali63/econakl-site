<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doodle Jump</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    #wrapper {
      position: relative;
      width: 400px;
      height: 600px;
      border: 3px solid #7ee8fa;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(126,232,250,0.4);
    }
    canvas { display: block; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(10,20,50,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #overlay h1 { font-size: 38px; color: #7ee8fa; letter-spacing: 2px; }
    #overlay p  { font-size: 18px; color: #ffd700; min-height: 24px; }
    #overlay button {
      padding: 12px 44px;
      font-size: 18px;
      font-weight: bold;
      background: #7ee8fa;
      color: #1a1a2e;
      border: none;
      border-radius: 40px;
      cursor: pointer;
    }
    #overlay button:hover { background: #80ff72; }
    #hint { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div id="wrapper">
    <canvas id="canvas" width="400" height="600"></canvas>
    <div id="overlay">
      <h1>Doodle Jump</h1>
      <p id="msg"></p>
      <button id="btn">Jouer</button>
    </div>
  </div>
  <p id="hint">← → pour bouger</p>

  <script>
  (function() {
    var canvas  = document.getElementById('canvas');
    var ctx     = canvas.getContext('2d');
    var overlay = document.getElementById('overlay');
    var msg     = document.getElementById('msg');
    var btn     = document.getElementById('btn');

    var W = 400, H = 600;
    var GRAVITY    = 0.38;
    var JUMP       = -11.5;
    var PW = 38, PH = 38;   // player size
    var PLW = 68, PLH = 14; // platform size

    var keys = {};
    var player, platforms, score, best, camY, running, raf;
    best = 0;

    // ── helpers ──────────────────────────────────────────────────────────────
    function rnd(a, b) { return Math.random() * (b - a) + a; }

    function drawRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function drawCircle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ── platform ─────────────────────────────────────────────────────────────
    // types: 0=normal, 1=moving, 2=breaking, 3=spring
    function mkPlat(x, y, type) {
      return { x:x, y:y, w:PLW, h:PLH, type:type||0,
               dx: type===1 ? (Math.random()<0.5?1.5:-1.5) : 0,
               broken:false, opacity:1, springOn:false };
    }

    function platColor(p) {
      if (p.type===1) return '#2196f3';
      if (p.type===2) return p.broken ? '#bf360c' : '#ff5722';
      if (p.type===3) return '#9c27b0';
      return '#4caf50';
    }

    function drawPlat(p) {
      var sy = p.y - camY;
      if (sy > H+20 || sy < -20) return;
      ctx.globalAlpha = p.opacity;
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(p.x+4, sy+p.h+2, p.w, 5);
      // body
      drawRect(p.x, sy, p.w, p.h, platColor(p));
      // shine
      drawRect(p.x+4, sy+3, p.w-8, 4, 'rgba(255,255,255,0.3)');
      // spring
      if (p.type===3) {
        var sh = p.springOn ? 20 : 10;
        var cx = p.x + p.w/2;
        ctx.strokeStyle = '#e040fb';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var t=0; t<=1; t+=0.05) {
          var sx2 = cx + Math.sin(t*Math.PI*4)*6;
          var sy2 = sy - t*sh;
          if (t===0) ctx.moveTo(sx2, sy2); else ctx.lineTo(sx2, sy2);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // ── player ───────────────────────────────────────────────────────────────
    function drawPlayer() {
      var px = player.x, py = player.y - camY;
      var cx = px + PW/2, cy = py + PH/2;
      var sy = player.squish;
      var sx2 = 1/sy;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(player.faceRight ? 1 : -1, 1);

      // body
      ctx.fillStyle = '#66bb6a';
      ctx.beginPath();
      ctx.scale(sx2, sy);
      ctx.arc(0, 0, PW/2, 0, Math.PI*2);
      ctx.fill();
      ctx.setTransform(1,0,0,1,0,0);

      ctx.translate(cx, cy);
      ctx.scale(player.faceRight ? 1 : -1, 1);

      // eye white
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(8, -5, 8, 0, Math.PI*2);
      ctx.fill();

      // pupil
      ctx.fillStyle = '#1b5e20';
      ctx.beginPath();
      ctx.arc(10, -5, 4, 0, Math.PI*2);
      ctx.fill();

      // highlight
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(11, -7, 1.5, 0, Math.PI*2);
      ctx.fill();

      // nose
      ctx.fillStyle = '#ef9a9a';
      ctx.beginPath();
      ctx.arc(14, -1, 3, 0, Math.PI*2);
      ctx.fill();

      ctx.restore();
    }

    // ── background ───────────────────────────────────────────────────────────
    function drawBg() {
      var g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#cdeeff');
      g.addColorStop(1, '#e8f8ff');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // clouds (deterministic per camera position)
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      var seed = Math.floor(camY / 200);
      for (var i=0; i<4; i++) {
        var cx = ((seed*137+i*89+300) % (W-120)) + 60;
        var cy = ((seed*61+i*113+100) % H);
        var r = 18 + (i*7)%16;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+r, cy, r*0.7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx-r, cy, r*0.6, 0, Math.PI*2); ctx.fill();
      }
    }

    // ── score HUD ─────────────────────────────────────────────────────────────
    function drawHUD() {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(8, 8, 110, 28);
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 16px Arial';
      ctx.fillText('Score: ' + score, 16, 27);
    }

    // ── init ─────────────────────────────────────────────────────────────────
    function init() {
      score = 0; camY = 0;
      player = { x: W/2-PW/2, y: H-160, vx:0, vy:0,
                 faceRight:true, squish:1 };
      platforms = [];
      platforms.push(mkPlat(W/2-PLW/2, H-120, 0));
      for (var i=1; i<10; i++) {
        var py = H - 120 - i*(H/10);
        platforms.push(mkPlat(rnd(10, W-PLW-10), py, 0));
      }
      player.vy = JUMP;
    }

    // ── platform generation ───────────────────────────────────────────────────
    function genPlats() {
      var minY = Infinity;
      for (var i=0; i<platforms.length; i++) minY = Math.min(minY, platforms[i].y);
      while (minY > camY - H) {
        var gap = rnd(62, 100 + Math.min(score/25, 55));
        var py  = minY - gap;
        var px  = rnd(10, W-PLW-10);
        var type = 0;
        var r = Math.random();
        if (score > 800)  { if (r < 0.18) type = 1; }
        if (score > 1800) { if (r < 0.12) type = 2; else if (r < 0.22) type = 1; }
        if (score > 3000) {
          if (r < 0.10) type = 2;
          else if (r < 0.22) type = 1;
          else if (r < 0.28) type = 3;
        }
        platforms.push(mkPlat(px, py, type));
        minY = py;
      }
      platforms = platforms.filter(function(p){ return p.y - camY < H+50; });
    }

    // ── collision ─────────────────────────────────────────────────────────────
    function collide() {
      if (player.vy <= 0) return;
      var pb = player.y + PH;
      var pl = player.x + 6, pr = player.x + PW - 6;
      for (var i=0; i<platforms.length; i++) {
        var p = platforms[i];
        if (p.opacity < 0.05) continue;
        if (pb >= p.y && pb <= p.y+p.h+14 && pr > p.x+4 && pl < p.x+p.w-4) {
          if (p.type===2) {
            if (!p.broken) {
              p.broken = true;
              bounce(JUMP);
              var fade = setInterval(function(){ p.opacity -= 0.09; if(p.opacity<=0){p.opacity=0;clearInterval(fade);}},25);
              return;
            }
            continue;
          }
          if (p.type===3) {
            p.springOn = true;
            setTimeout(function(){p.springOn=false;},300);
            bounce(JUMP*1.75);
          } else {
            bounce(JUMP);
          }
          return;
        }
      }
    }

    function bounce(force) {
      player.vy = force;
      player.squish = 0.5;
    }

    // ── update ────────────────────────────────────────────────────────────────
    function update() {
      var ax = 0;
      if (keys['ArrowLeft']  || keys['a'] || keys['A']) ax = -0.8;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) ax = 0.8;
      if (window._tilt) ax = window._tilt;

      player.vx = player.vx * 0.80 + ax * 2.5;
      player.x += player.vx;
      if (player.x + PW < 0) player.x = W;
      if (player.x > W)      player.x = -PW;
      if (player.vx >  0.3) player.faceRight = true;
      if (player.vx < -0.3) player.faceRight = false;

      player.vy += GRAVITY;
      player.y  += player.vy;

      player.squish += (1 - player.squish) * 0.2;
      if (player.squish > 1.3) player.squish = 1.3;

      // camera
      var screenY = player.y - camY;
      if (screenY < H/2.5) {
        camY -= H/2.5 - screenY;
        score = Math.max(score, Math.floor(-camY/5));
      }

      // moving platforms
      for (var i=0; i<platforms.length; i++) {
        var p = platforms[i];
        if (p.type===1) {
          p.x += p.dx;
          if (p.x < 0 || p.x+p.w > W) p.dx *= -1;
        }
      }

      collide();
      genPlats();

      if (player.y - camY > H + 50) endGame();
    }

    // ── loop ──────────────────────────────────────────────────────────────────
    function loop() {
      if (!running) return;
      update();
      drawBg();
      for (var i=0; i<platforms.length; i++) drawPlat(platforms[i]);
      drawPlayer();
      drawHUD();
      raf = requestAnimationFrame(loop);
    }

    function startGame() {
      init();
      overlay.style.display = 'none';
      running = true;
      cancelAnimationFrame(raf);
      loop();
    }

    function endGame() {
      running = false;
      cancelAnimationFrame(raf);
      best = Math.max(best, score);
      msg.textContent = 'Score: ' + score + '  |  Meilleur: ' + best;
      btn.textContent = 'Rejouer';
      overlay.style.display = 'flex';
    }

    // ── controls ──────────────────────────────────────────────────────────────
    document.addEventListener('keydown', function(e){ keys[e.key]=true; });
    document.addEventListener('keyup',   function(e){ keys[e.key]=false; });
    window.addEventListener('deviceorientation', function(e){
      window._tilt = Math.max(-1, Math.min(1, (e.gamma||0)/15));
    });

    btn.addEventListener('click', startGame);

    // draw static bg on load
    drawBg();
  })();
  </script>
</body>
</html>
